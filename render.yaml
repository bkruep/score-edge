services:
  - type: web
    name: parlayandpray
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ODDS_API_KEY
        sync: false
      - key: DFS_DATA_SOURCE
        value: dk
